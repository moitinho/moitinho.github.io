        :root {
            --bg: #eeecea;

            --divider: #c5c1bb;
            --card-bg: #f7f5f2;
            --card-border: #d8d4ce;
            --btn-bg: #1a1a18;
            --btn-fg: #eeecea;
            --btn-hover: #333330;
            --max-width: 520px;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #5a5856;
                --fg: #f2f0ec;
                --fg-secondary: #d5d2cc;
                --fg-tertiary: #b0ada7;
                --divider: #706d68;
                --card-bg: #4a4845;
                --card-border: #635f5b;
                --btn-bg: #f2f0ec;
                --btn-fg: #3a3836;
                --btn-hover: #e0ddd8;
            }
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Source Serif 4', Georgia, serif;
            background: var(--bg);
            color: var(--fg);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        .page {
            max-width: var(--max-width);
            margin: 0 auto;
            padding: 56px 24px 64px;
            animation: rise 0.7s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes rise {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .ornament {
            text-align: center;
            color: var(--fg-tertiary);
            font-size: 0.7rem;
            letter-spacing: 0.6em;
            margin-bottom: 20px;
        }

        h1 {
            font-family: 'Playfair Display', Georgia, serif;
            font-weight: 600;
            font-size: 2rem;
            text-align: center;
            letter-spacing: 0.01em;
        }

        .divider {
            width: 56px;
            height: 1px;
            background: var(--divider);
            margin: 22px auto 26px;
        }

        .body-text {
            color: var(--fg-secondary);
            text-align: center;
            font-size: 1.02rem;
            font-weight: 300;
            margin-bottom: 36px;
        }

        form { display: flex; flex-direction: column; gap: 22px; }

        .field label {
            display: block;
            font-size: 0.78rem;
            font-weight: 500;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--fg-tertiary);
            margin-bottom: 8px;
        }

        .field input,
        .field textarea {
            width: 100%;
            font-family: 'Source Serif 4', Georgia, serif;
            font-size: 1rem;
            font-weight: 400;
            color: var(--fg);
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 10px;
            padding: 13px 15px;
            outline: none;
            transition: border-color 0.25s ease;
        }

        .field input:focus,
        .field textarea:focus { border-color: var(--fg-tertiary); }

        .field input::placeholder,
        .field textarea::placeholder { color: var(--fg-tertiary); opacity: 0.8; }

        .field textarea { min-height: 96px; resize: vertical; }

        .submit-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-family: 'Source Serif 4', Georgia, serif;
            font-size: 1rem;
            font-weight: 500;
            background: var(--btn-bg);
            color: var(--btn-fg);
            border: none;
            border-radius: 12px;
            padding: 15px 22px;
            margin-top: 6px;
            cursor: pointer;
            transition: background 0.25s ease, transform 0.25s ease;
        }

        .submit-button:hover { background: var(--btn-hover); transform: translateY(-1px); }

        .submit-button svg { width: 18px; height: 18px; }
        .submit-button:disabled { opacity: 0.6; cursor: progress; }

        .honeypot { position: absolute; left: -9999px; width: 1px; height: 1px; opacity: 0; }

        .form-error {
            display: none;
            margin-top: 2px;
            font-size: 0.9rem;
            line-height: 1.5;
            color: #b3403a;
            text-align: left;
        }
        .form-error a { color: inherit; }
        @media (prefers-color-scheme: dark) { .form-error { color: #ffb4a9; } }

        .form-success {
            display: none;
            margin-top: 28px;
            font-size: 1.02rem;
            line-height: 1.7;
            color: var(--fg-secondary);
            text-align: center;
        }

        .footer {
            margin-top: 44px;
            text-align: center;
        }

        .footer-link {
            color: var(--fg-tertiary);
            font-size: 0.85rem;
            text-decoration: none;
            border-bottom: 1px solid transparent;
            transition: border-color 0.25s ease;
        }

        .footer-link:hover { border-color: var(--fg-tertiary); }

        .footer-sep {
            color: var(--fg-tertiary);
            margin: 0 10px;
            font-size: 0.8rem;
            opacity: 0.55;
        }

        @media (max-width: 480px) {
            .page { padding: 44px 20px 56px; }
            h1 { font-size: 1.7rem; }
        }
    </style>
</head>

        // FORM_TYPE / SOURCE so Support, Book request, and CCB reports stay
        // distinguishable in the one inbox. RECIPIENT is only the manual
        // fallback shown if the request ever fails.
        var SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxE6kYRYF31iIwoJATqHuTEUJilDLWZj0jvlCaTRtAgktWxj3is0fhczmyhMLOaQSLGHw/exec';

        var SOURCE = 'Public Domain Books — Book request';
        var RECIPIENT = 'bibliahinarioccb@gmail.com';

        // Which platform the submission came from. An explicit ?platform= (set
        // by the app's link) wins; otherwise infer from the user agent, so every
        // submission is tagged. Shared across all forms for a standard payload.
        function detectPlatform() {
            var explicit = new URLSearchParams(window.location.search).get('platform');
            if (explicit) return explicit;
            var ua = navigator.userAgent || '';
            if (/Android/i.test(ua)) return 'Android';
            if (/iPhone|iPad|iPod/i.test(ua)) return 'iOS';
            if (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1) return 'iOS';
            return 'Web';
        }

                trIntro: "这本书已以原文或经典公版译本收录在书库中。翻译按请求制作——告诉我们您希望用哪种语言阅读它。较短的作品几天内即可完成（较长的作品需要更久），新版本会自动出现在应用中，无需安装或更新。",
                trSubject: "翻译请求 — Public Domain Books",
                introNote: "两点说明：书库只能收录公有领域的作品；新版本完成后会自动出现在应用中。",
                bodyBook: "书籍", bodyLang: "语言", bodyContact: "联系方式",
                privacy: "隐私政策",
                support: "支持",
                success: "谢谢！您的请求已发送。",
                netError: "暂时无法发送——请重试，或发送邮件至"
            },
            tr: {
                title: "Kitap İste",
                intro: "Hangi klasiğin eksik olduğunu — ya da hangi dilde okumak istediğini — bize söyle. Kütüphanedeki her basım, senin gibi bir istekle başladı.",
                bookLabel: "Kitap",
                bookPlaceholder: "Başlık ve yazar",
                langLabel: "Dil veya çeviri (isteğe bağlı)",
                langPlaceholder: "örn. Türkçe",
                emailLabel: "E-postan",
                emailPlaceholder: "Geldiğinde haber verebilmemiz için",
                notesLabel: "Başka bir şey? (isteğe bağlı)",
                notesPlaceholder: "Belirli bir basım, bağlantılar, bağlam…",
                submit: "İsteği gönder",
                subject: "Kitap isteği — Public Domain Books",
                trTitle: "Bir Çeviri İsteyin",
                trIntro: "Bu kitap özgün dilinde veya kamu malı klasik bir çeviriyle zaten kitaplıkta. Çeviriler istek üzerine hazırlanır — hangi dilde okumak istediğinizi söyleyin. Kısa eserler birkaç günde hazır olabilir (uzunlar biraz daha sürer) ve yeni basım uygulamada kendiliğinden görünür — kurulum ya da güncelleme gerekmez.",
                trSubject: "Çeviri isteği — Public Domain Books",
                introNote: "İki not: Kitaplığa yalnızca kamu malı eserler eklenebilir ve yeni basımlar hazır olduğunda uygulamada kendiliğinden görünür.",
                bodyBook: "Kitap", bodyLang: "Dil", bodyContact: "İletişim",
                privacy: "Gizlilik Politikası",
                support: "Destek",
                success: "Teşekkürler! İsteğiniz gönderildi.",
                netError: "Şu anda gönderilemedi — tekrar deneyin veya bana şu adresten yazın:"
            }
        };

        function getLocale() {
            var lang = (navigator.language || navigator.userLanguage || 'en').toLowerCase();
            var primary = lang.split('-')[0];
            if (i18n[primary]) return primary;
            return 'en';
        }

        // Translation mode: the reader's "not in your language yet" banner
        // links here with ?mode=translation&book=<title>&lang=<name or code>.
        // Same form, same payload contract — only the copy, the prefill, and
        // the subject line change (plus an additive `mode` field). A plain
        // visit without params behaves exactly as before.
        var PARAMS = new URLSearchParams(window.location.search);
        var MODE = PARAMS.get('mode') === 'translation' ? 'translation' : 'request';

        // If `lang` arrives as one of the app's language codes, expand it to
        // the language's own native name (locale-independent). Anything else
        // passes through untouched.
        var LANG_NAMES = {
            en: "English", pt: "Português", es: "Español", it: "Italiano",
            fr: "Français", de: "Deutsch", ja: "日本語", ko: "한국어",
            ru: "Русский", zh: "中文", tr: "Türkçe", la: "Latina"
        };
        function requestedLanguage() {
            var raw = (PARAMS.get('lang') || '').trim();
            return LANG_NAMES[raw.toLowerCase()] || raw;
        }

        function sendRequest(event) {
            event.preventDefault();
            var locale = getLocale();
            var t = i18n[locale];
            var book = document.getElementById('book').value.trim();
            var language = document.getElementById('language').value.trim();
            var email = document.getElementById('email').value.trim();
            var notes = document.getElementById('notes').value.trim();
            var errorEl = document.getElementById('form-error');
            var button = document.getElementById('submit-button');

            // Honeypot: a bot that fills the hidden field is silently dropped.
            if (document.getElementById('_hp').value) { return; }

            var data = new FormData();
            data.set('formType', FORM_TYPE);
            data.set('source', SOURCE);
            data.set('subject', MODE === 'translation' ? t.trSubject : t.subject);
            if (MODE === 'translation') data.set('mode', 'translation');
            data.set('book', book);
            if (language) data.set('language', language);
            data.set('contact', email);
            if (notes) data.set('notes', notes);
            data.set('platform', detectPlatform());
            data.set('pageLanguage', locale);
            var v = new URLSearchParams(window.location.search).get('v');
            if (v) data.set('appVersion', v);

            errorEl.style.display = 'none';
            button.disabled = true;

            fetch(SCRIPT_URL, { method: 'POST', body: data })
                .then(function(r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
                .then(function() {
                    document.getElementById('form-wrap').style.display = 'none';
                    var s = document.getElementById('form-success');
                    s.textContent = t.success;
                    s.style.display = 'block';
                })
                .catch(function() {
                    errorEl.innerHTML = t.netError + ' <a href="mail' + 'to:' + RECIPIENT + '">' + RECIPIENT + '</a>';
                    errorEl.style.display = 'block';
                    button.disabled = false;
                });
        }

        function render() {
            var locale = getLocale();
            var t = i18n[locale];
            document.documentElement.lang = locale === 'zh' ? 'zh-Hans' : locale;
            var title = MODE === 'translation' ? t.trTitle : t.title;
            var intro = MODE === 'translation'
                ? t.trIntro
                : t.intro + ' ' + t.introNote;
            document.title = title;
            // In translation mode the language IS the request — require it,
            // and drop the "(optional)" parenthetical from the label (the
            // regex handles Western and full-width CJK parentheses alike).
            var langRequired = MODE === 'translation' ? ' required' : '';
            var langLabel = MODE === 'translation'
                ? t.langLabel.replace(/\s*[（(][^)）]*[)）]\s*$/, '')
                : t.langLabel;

            document.getElementById('page').innerHTML =
                '<div class="ornament">•   •   •</div>' +
                '<h1>' + title + '</h1>' +
                '<div class="divider"></div>' +
                '<p class="body-text">' + intro + '</p>' +
                '<div id="form-wrap">' +
                '<form onsubmit="sendRequest(event)">' +
                    '<div class="field">' +
                        '<label for="book">' + t.bookLabel + '</label>' +
                        '<input id="book" type="text" required placeholder="' + t.bookPlaceholder + '">' +
                    '</div>' +
                    '<div class="field">' +
                        '<label for="language">' + langLabel + '</label>' +
                        '<input id="language" type="text"' + langRequired + ' placeholder="' + t.langPlaceholder + '">' +
                    '</div>' +
                    '<div class="field">' +
                        '<label for="email">' + t.emailLabel + '</label>' +
                        '<input id="email" type="email" required placeholder="' + t.emailPlaceholder + '">' +
                    '</div>' +
                    '<div class="field">' +
                        '<label for="notes">' + t.notesLabel + '</label>' +
                        '<textarea id="notes" placeholder="' + t.notesPlaceholder + '"></textarea>' +
                    '</div>' +
                    '<input type="text" id="_hp" class="honeypot" tabindex="-1" autocomplete="off" aria-hidden="true">' +
                    '<p class="form-error" id="form-error"></p>' +
                    '<button type="submit" class="submit-button" id="submit-button">' +
                        '<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M6 12L3.269 3.126A59.768 59.768 0 0121.485 12 59.77 59.77 0 013.27 20.876L5.999 12zm0 0h7.5"/></svg>' +
                        t.submit +
                    '</button>' +
                '</form>' +
                '</div>' +
                '<p class="form-success" id="form-success"></p>' +
                '<div class="footer">' +
                    '<a href="support.html" class="footer-link">' + t.support + '</a>' +
                    '<span class="footer-sep">·</span>' +
                    '<a href="privacy.html" class="footer-link">' + t.privacy + '</a>' +
                '</div>';
        }

        render();

        // Prefill from the app's deep link — assigned via .value (never
        // interpolated into markup) so URL params can't inject HTML. Both
        // fields stay editable; the user can still adjust before sending.
        (function prefill() {
            var book = (PARAMS.get('book') || '').trim();
            if (book) document.getElementById('book').value = book;
            var lang = requestedLanguage();
            if (lang) document.getElementById('language').value = lang;
        })();
    </script>
</body>
</html>
