<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classic Editions — Public Domain Books</title>
    <link rel="stylesheet" href="fonts/fonts.css">
    <style>
        :root {
            --bg: #eeecea;
            --fg: #1a1a18;
            --fg-secondary: #4a4944;
            --fg-tertiary: #7a7872;
            --divider: #c5c1bb;
            --card-bg: #f7f5f2;
            --card-border: #d8d4ce;
            --card-hover-shadow: 0 2px 8px rgba(0,0,0,0.05), 0 6px 24px rgba(0,0,0,0.06);
            --btn-bg: #1a1a18;
            --btn-fg: #eeecea;
            --btn-hover: #333330;
            --icon-edge: rgba(0, 0, 0, 0.12);
            --max-width: 520px;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #5a5856;
                --fg: #f2f0ec;
                --fg-secondary: #d5d2cc;
                --fg-tertiary: #b0ada7;
                --divider: #706d68;
                --card-bg: #4a4845;
                --card-border: #635f5b;
                --card-hover-shadow: 0 2px 8px rgba(0,0,0,0.15), 0 6px 24px rgba(0,0,0,0.2);
                --btn-bg: #f2f0ec;
                --btn-fg: #3a3836;
                --btn-hover: #e0ddd8;
                --icon-edge: rgba(255, 255, 255, 0.16);
            }
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Source Serif 4', Georgia, serif;
            background: var(--bg);
            color: var(--fg);
            line-height: 1.7;
            font-size: 16px;
            -webkit-font-smoothing: antialiased;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 64px 28px;
        }

        .page {
            max-width: var(--max-width);
            width: 100%;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .ornament {
            text-align: center;
            color: var(--fg-tertiary);
            font-size: 18px;
            letter-spacing: 0.4em;
            margin-bottom: 44px;
            opacity: 0;
            animation: fadeIn 1s ease 0.2s forwards;
        }

        h1 {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: clamp(28px, 6vw, 36px);
            font-weight: 700;
            line-height: 1.2;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            text-align: center;
            color: var(--fg);
            opacity: 0;
            animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.3s forwards;
        }

        .divider {
            width: 48px;
            height: 1px;
            background: var(--divider);
            margin: 36px auto;
            opacity: 0;
            animation: fadeIn 0.8s ease 0.5s forwards;
        }

        .body-text {
            font-size: 16px;
            font-weight: 400;
            line-height: 1.85;
            color: var(--fg-secondary);
            text-align: center;
            opacity: 0;
            animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.65s forwards;
        }

        /* --- Book list --- */
        .book-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 40px;
        }

        .book-card {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 18px 20px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            text-decoration: none;
            color: inherit;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            opacity: 0;
            animation: fadeUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        a.book-card:hover {
            border-color: transparent;
            box-shadow: var(--card-hover-shadow);
            transform: translateY(-2px);
        }

        .book-card.coming-soon {
            cursor: default;
        }

        .book-icon {
            position: relative;
            width: 52px;
            height: 52px;
            border-radius: 11px;
            flex-shrink: 0;
            overflow: hidden;
            background: var(--divider);
        }

        /* The artwork sits on top of the letter tile rather than replacing it,
           so the letter is still there underneath if the file ever 404s. */
        .book-icon img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* App Store artwork ships square and edge-to-edge, so the rounding is
           ours to apply — and a light icon on a light card, or a dark one in
           dark mode, has no edge of its own. Hairline inset, drawn over the
           image only when there is an image. */
        .book-icon.has-art::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            box-shadow: inset 0 0 0 1px var(--icon-edge);
            pointer-events: none;
        }

        .book-icon-fallback {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Playfair Display', Georgia, serif;
            font-size: 18px;
            font-weight: 600;
            color: #fff;
            background: linear-gradient(135deg, #6b5b4a, #8a7a68);
        }

        .book-info { flex: 1; min-width: 0; }

        .book-author {
            display: block;
            font-family: 'Source Serif 4', Georgia, serif;
            font-size: 12px;
            font-weight: 400;
            font-style: italic;
            color: var(--fg-tertiary);
            letter-spacing: 0.02em;
            margin-bottom: 1px;
        }

        .book-title {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: 17px;
            font-weight: 500;
            color: var(--fg);
            line-height: 1.3;
        }

        .book-desc {
            font-size: 14px;
            color: var(--fg-secondary);
            margin-top: 2px;
            font-weight: 400;
            line-height: 1.5;
        }

        .book-badge {
            display: inline-block;
            font-family: 'Source Serif 4', Georgia, serif;
            font-size: 11px;
            font-weight: 400;
            font-style: italic;
            color: var(--fg-tertiary);
            margin-top: 4px;
        }

        .book-arrow {
            color: var(--fg-tertiary);
            transition: all 0.25s ease;
            flex-shrink: 0;
        }

        a.book-card:hover .book-arrow {
            color: var(--fg);
            transform: translateX(3px);
        }

        /* --- Footer --- */
        .footer {
            margin-top: 48px;
            text-align: center;
            opacity: 0;
            animation: fadeIn 0.8s ease forwards;
        }

        .footer-links {
            display: flex;
            justify-content: center;
            gap: 24px;
        }

        .footer-link {
            font-size: 14px;
            font-style: italic;
            color: var(--fg-tertiary);
            text-decoration: none;
            transition: color 0.2s ease;
            border-bottom: 1px solid transparent;
        }

        .footer-link:hover {
            color: var(--fg-secondary);
            border-bottom-color: var(--divider);
        }

        .footer-brand {
            margin-top: 28px;
            font-size: 13px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--fg-tertiary);
            font-weight: 500;
        }

        .footer-credit {
            margin-top: 8px;
            font-size: 14px;
            font-style: italic;
            color: var(--fg-tertiary);
            font-weight: 400;
        }

        .footer-credit a {
            color: var(--fg-tertiary);
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .footer-credit a:hover {
            color: var(--fg);
        }

        @media (max-width: 480px) {
            body { padding: 48px 24px; }
            .ornament { margin-bottom: 36px; }
            .divider { margin: 28px auto; }
            .book-list { margin-top: 32px; }
            .book-card { padding: 14px 16px; gap: 12px; }
            .book-icon { width: 46px; height: 46px; border-radius: 10px; }
            .footer { margin-top: 40px; }
        }
    </style>
</head>

        function getLocale() {
            var lang = (navigator.language || navigator.userLanguage || 'en').toLowerCase();
            var primary = lang.split('-')[0];
            if (i18n[primary]) return primary;
            return 'en';
        }

        function render() {
            var locale = getLocale();
            var t = i18n[locale];
            document.documentElement.lang = locale === 'zh' ? 'zh-Hans' : locale;
            document.title = t.pageTitle + ' — Public Domain Books';

            var cardsHtml = books.map(function(book, i) {
                var bt = t.books[book.id] || {};
                var delay = (0.8 + i * 0.1).toFixed(1);
                var tag = book.appId ? 'a' : 'div';
                var href = book.appId ? ' href="https://apps.apple.com/' + book.country + '/app/id' + book.appId + '" target="_blank" rel="noopener"' : '';
                var cls = book.appId ? 'book-card' : 'book-card coming-soon';
                var arrow = book.appId
                    ? '<svg class="book-arrow" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12h15m0 0l-6.75-6.75M19.5 12l-6.75 6.75"/></svg>'
                    : '<span class="book-badge">' + t.comingSoon + '</span>';

                // The letter tile is always rendered; the artwork, when we have
                // it, is layered over it. Nothing here touches the network.
                var art = book.icon
                    ? '<img src="' + book.icon + '" alt="" width="52" height="52" loading="lazy" decoding="async">'
                    : '';
                var iconCls = book.icon ? 'book-icon has-art' : 'book-icon';

                // data-appid / data-country used to exist only so the icon fetch
                // could read them back off the DOM. Nothing reads them now.
                return '<' + tag + href + ' class="' + cls + '" style="animation-delay:' + delay + 's">' +
                    '<div class="' + iconCls + '"><div class="book-icon-fallback">' + book.fallbackInitial + '</div>' + art + '</div>' +
                    '<div class="book-info">' +
                        '<span class="book-author">' + book.author + '</span>' +
                        '<div class="book-title">' + (bt.title || book.id) + '</div>' +
                        '<div class="book-desc">' + (bt.desc || '') + '</div>' +
                    '</div>' +
                    arrow +
                '</' + tag + '>';
            }).join('');

            var footerDelay = (0.8 + books.length * 0.1 + 0.2).toFixed(1);

            document.getElementById('page').innerHTML =
                '<div class="ornament">\u2022 \u2003 \u2022 \u2003 \u2022</div>' +
                '<h1>' + t.pageTitle + '</h1>' +
                '<div class="divider"></div>' +
                '<p class="body-text">' + t.intro + '</p>' +
                '<div class="book-list">' + cardsHtml + '</div>' +
                '<div class="footer" style="animation-delay:' + footerDelay + 's">' +
                    '<div class="footer-links">' +
                        '<a href="support.html" class="footer-link">' + t.support + '</a>' +
                        '<a href="bookrequest.html" class="footer-link">' + t.bookRequest + '</a>' +
                        '<a href="privacy.html" class="footer-link">' + t.privacy + '</a>' +
                    '</div>' +
                    '<p class="footer-brand">Public Domain Books</p>' +
                    '<p class="footer-credit">' + t.madeBy + ' <a href="https://moitinho.github.io/" target="_blank" rel="noopener">Pedro Moitinho</a></p>' +
                '</div>';

            // The icons are already on this origin — there is no lookup to do.
            // The only thing left is the failure case: if a file is ever
            // missing, fall back to the letter tile underneath rather than
            // leave a broken-image glyph on the card.
            document.querySelectorAll('.book-icon img').forEach(function(img) {
                img.addEventListener('error', function() {
                    var tile = img.parentNode;
                    if (tile) tile.classList.remove('has-art');
                    img.remove();
                });
            });
        }

        render();
    </script>
