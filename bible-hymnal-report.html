<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report a Problem - Bíblia e Hinário CCB</title>
    <meta name="description" content="Report an issue or content error in Bíblia e Hinário CCB.">
    <link rel="stylesheet" href="fonts/fonts.css">
    <style>
        :root {
            --bg: #eeecea;
            --fg: #1a1a18;
            --fg-secondary: #4a4944;
            --fg-tertiary: #7a7872;
            --divider: #c5c1bb;
            --card-bg: #f7f5f2;
            --card-border: #d8d4ce;
            --field-bg: #fffdfa;
            --btn-bg: #1a1a18;
            --btn-fg: #eeecea;
            --btn-hover: #333330;
            --error: #9f2f2f;
            --max-width: 560px;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #5a5856;
                --fg: #f2f0ec;
                --fg-secondary: #d5d2cc;
                --fg-tertiary: #b0ada7;
                --divider: #706d68;
                --card-bg: #4a4845;
                --card-border: #635f5b;
                --field-bg: #3f3d3a;
                --btn-bg: #f2f0ec;
                --btn-fg: #3a3836;
                --btn-hover: #e0ddd8;
                --error: #ffb4a9;
            }
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Source Serif 4', Georgia, serif;
            background: var(--bg);
            color: var(--fg);
            line-height: 1.7;
            font-size: 16px;
            -webkit-font-smoothing: antialiased;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 56px 24px;
        }

        .page {
            max-width: var(--max-width);
            width: 100%;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .ornament {
            text-align: center;
            color: var(--fg-tertiary);
            font-size: 18px;
            letter-spacing: 0.4em;
            margin-bottom: 36px;
            opacity: 0;
            animation: fadeIn 1s ease 0.2s forwards;
        }

        h1 {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: clamp(28px, 6vw, 36px);
            font-weight: 700;
            line-height: 1.2;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            text-align: center;
            color: var(--fg);
            opacity: 0;
            animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.3s forwards;
        }

        .divider {
            width: 48px;
            height: 1px;
            background: var(--divider);
            margin: 30px auto;
            opacity: 0;
            animation: fadeIn 0.8s ease 0.5s forwards;
        }

        .body-text {
            font-size: 16px;
            font-weight: 400;
            line-height: 1.85;
            color: var(--fg-secondary);
            text-align: center;
            opacity: 0;
            animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.65s forwards;
        }

        .report-form {
            margin-top: 34px;
            padding: 22px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            opacity: 0;
            animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.8s forwards;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-size: 15px;
            color: var(--fg);
        }

        textarea,
        input {
            width: 100%;
            font: inherit;
            color: var(--fg);
            background: var(--field-bg);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 12px 13px;
            outline: none;
        }

        textarea:focus,
        input:focus {
            border-color: var(--fg-tertiary);
        }

        textarea {
            min-height: 150px;
            resize: vertical;
        }

        .field {
            margin-bottom: 18px;
        }

        .hint {
            margin-top: 6px;
            font-size: 13px;
            color: var(--fg-tertiary);
        }

        .error {
            display: none;
            margin: -4px 0 16px;
            font-size: 14px;
            color: var(--error);
        }

        /* Advisory only — never blocks submission. Reuses the page's hint
           styling so it reads as a suggestion, not an error. */
        .email-suggestion {
            display: none;
            margin-top: 6px;
            font-size: 13px;
            color: var(--fg-secondary);
        }

        .email-suggestion button {
            font: inherit;
            color: inherit;
            background: none;
            border: none;
            padding: 0;
            cursor: pointer;
            text-decoration: underline;
        }

        .email-suggestion-accept {
            color: var(--fg);
            font-weight: 600;
        }

        .cta-button {
            width: 100%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-family: 'Source Serif 4', Georgia, serif;
            font-size: 15px;
            font-weight: 400;
            letter-spacing: 0.04em;
            color: var(--btn-fg);
            background: var(--btn-bg);
            border: 0;
            text-decoration: none;
            padding: 14px 24px;
            border-radius: 100px;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            cursor: pointer;
        }

        .cta-button:hover {
            background: var(--btn-hover);
            transform: translateY(-1px);
        }

        .cta-button svg {
            width: 16px;
            height: 16px;
        }

        .fallback {
            display: none;
            margin-top: 18px;
            padding-top: 18px;
            border-top: 1px solid var(--card-border);
            color: var(--fg-secondary);
            font-size: 14px;
        }

        .fallback strong {
            color: var(--fg);
        }

        .fallback-message {
            margin-top: 10px;
            white-space: pre-wrap;
            word-break: break-word;
            color: var(--fg-secondary);
        }

        .honeypot {
            position: absolute;
            left: -9999px;
            top: -9999px;
            width: 1px;
            height: 1px;
            opacity: 0;
        }

        .cta-button:disabled {
            opacity: 0.6;
            cursor: progress;
        }

        .success {
            display: none;
            margin-top: 34px;
            padding: 22px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            text-align: center;
            color: var(--fg-secondary);
            font-size: 16px;
            line-height: 1.85;
        }

        .footer {
            margin-top: 40px;
            text-align: center;
            opacity: 0;
            animation: fadeIn 0.8s ease 1s forwards;
        }

        .footer-text {
            font-size: 14px;
            font-style: italic;
            color: var(--fg-secondary);
            font-weight: 400;
        }

        .footer-link {
            color: var(--fg-tertiary);
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .footer-link:hover {
            color: var(--fg);
        }

        @media (max-width: 480px) {
            body { padding: 40px 20px; }
            .ornament { margin-bottom: 30px; }
            .divider { margin: 26px auto; }
            .report-form { padding: 18px; }
        }
    </style>
</head>
<body>
    <div class="page">
        <div class="ornament">•   •   •</div>
        <h1 id="title"></h1>
        <div class="divider"></div>
        <p class="body-text" id="intro"></p>

        <form class="report-form" id="reportForm" novalidate>
            <div class="field">
                <label for="message" id="messageLabel"></label>
                <textarea id="message" name="message" required></textarea>
                <p class="hint" id="messageHint"></p>
            </div>

            <div class="field">
                <label for="contact" id="contactLabel"></label>
                <input id="contact" name="contact" type="email" autocomplete="email" required>

            </div>

            <input type="text" name="_honeypot" id="_honeypot" class="honeypot" tabindex="-1" autocomplete="off">

            <p class="error" id="error"></p>

            <button type="submit" class="cta-button" id="submitButton">

                <span id="buttonText"></span>
            </button>

            <div class="fallback" id="fallback">
                <p id="fallbackIntro"></p>
                <p><strong id="emailLabel"></strong> <span id="recipient"></span></p>
                <div class="fallback-message" id="fallbackMessage"></div>
            </div>
        </form>

        <div class="success" id="success">
            <p id="successText"></p>
        </div>

        <div class="footer">
            <span class="footer-text" id="footer"></span>
        </div>
    </div>

        function getLocale() {
            var params = new URLSearchParams(window.location.search);
            var requested = (params.get('lang') || '').toLowerCase().split('-')[0];
            if (i18n[requested]) return requested;

            var languages = navigator.languages || [navigator.language || navigator.userLanguage || 'en'];
            for (var i = 0; i < languages.length; i++) {
                var primary = String(languages[i]).toLowerCase().split('-')[0];
                if (i18n[primary]) return primary;
            }
            return 'en';
        }

        // Which app the report came from. An explicit ?platform= (set per
        // store build in the remote-config action URL) wins; otherwise fall
        // back to the user agent so every report is tagged automatically.
        function detectPlatform() {
            var explicit = new URLSearchParams(window.location.search).get('platform');
            if (explicit) return explicit;
            var ua = navigator.userAgent || '';
            if (/Android/i.test(ua)) return 'Android';
            if (/iPhone|iPad|iPod/i.test(ua)) return 'iOS';
            // iPadOS Safari can report as desktop Mac but still has touch.
            if (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1) return 'iOS';
            return 'Web';
        }

        // --- Email typo guard (T-FORM-EMAIL) ---
        // Local-only, no network call. isEmailSyntaxValid() catches addresses
        // that can never be delivered (no dot in the domain, a trailing dot,
        // doubled @, internal whitespace) and is the one thing here allowed
        // to block submission — none of those forms would ever reach a real
        // inbox anyway. suggestEmailDomain() is a *guess* at a mistyped
        // well-known domain (gimail.com -> gmail.com) via edit distance
        // against a short known-domains list, so a new typo needs no code
        // change; it only ever offers, never corrects or blocks.
        var KNOWN_EMAIL_DOMAINS = [
            'gmail.com', 'googlemail.com', 'yahoo.com', 'outlook.com', 'hotmail.com',
            'icloud.com', 'me.com', 'live.com', 'aol.com', 'protonmail.com',
            'gmx.com', 'yandex.com', 'mail.com', 'zoho.com'
        ];

        function isEmailSyntaxValid(value) {
            if (!value || /\s/.test(value)) return false;
            if ((value.match(/@/g) || []).length !== 1) return false;
            var at = value.indexOf('@');
            var local = value.slice(0, at);
            var domain = value.slice(at + 1);
            if (!local || !domain) return false;
            if (domain.charAt(0) === '.' || domain.charAt(domain.length - 1) === '.') return false;
            if (domain.indexOf('..') !== -1) return false;
            if (domain.indexOf('.') === -1) return false;
            var labels = domain.split('.');
            var tld = labels[labels.length - 1];
            return /^[a-zA-Z]{2,}$/.test(tld);
        }

        function levenshtein(a, b) {
            var m = a.length, n = b.length;
            var prev = [];
            for (var j = 0; j <= n; j++) prev[j] = j;
            for (var i = 1; i <= m; i++) {
                var cur = [i];
                for (j = 1; j <= n; j++) {
                    var cost = a.charAt(i - 1) === b.charAt(j - 1) ? 0 : 1;
                    cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + cost);
                }
                prev = cur;
            }
            return prev[n];
        }

        function suggestEmailDomain(value) {
            var at = value.lastIndexOf('@');
            if (at === -1 || at === value.length - 1) return null;
            var domain = value.slice(at + 1).toLowerCase();
            if (KNOWN_EMAIL_DOMAINS.indexOf(domain) !== -1) return null;

            var best = null, bestDist = Infinity;
            for (var i = 0; i < KNOWN_EMAIL_DOMAINS.length; i++) {
                var candidate = KNOWN_EMAIL_DOMAINS[i];
                if (Math.abs(candidate.length - domain.length) > 3) continue;
                var dist = levenshtein(domain, candidate);
                if (dist < bestDist) { bestDist = dist; best = candidate; }
            }
            var threshold = domain.length <= 5 ? 1 : 2;
            if (best && bestDist > 0 && bestDist <= threshold) {
                return value.slice(0, at + 1) + best;
            }
            return null;
        }

        // Wires the inline "did you mean…?" suggestion onto one email input.
        // Purely advisory: accepting fills the field, dismissing just hides
        // it for that exact typed value, and either way the form still
        // submits whatever the reader leaves in the field.
        function setupEmailSuggestion(input, container, strings) {
            if (!input || !container) return;
            var dismissedFor = null;

            function clear() {
                container.textContent = '';
                container.style.display = 'none';
            }

            function show(rawValue, suggested) {
                container.textContent = '';
                var template = strings.suggestion;
                var idx = template.indexOf('{email}');
                var before = idx === -1 ? template : template.slice(0, idx);
                var after = idx === -1 ? '' : template.slice(idx + 7);
                container.appendChild(document.createTextNode(before));
                var acceptBtn = document.createElement('button');
                acceptBtn.type = 'button';
                acceptBtn.className = 'email-suggestion-accept';
                acceptBtn.textContent = suggested;
                acceptBtn.addEventListener('click', function() {
                    input.value = suggested;
                    clear();
                    input.focus();
                });
                container.appendChild(acceptBtn);
                container.appendChild(document.createTextNode(after + ' '));
                var dismissBtn = document.createElement('button');
                dismissBtn.type = 'button';
                dismissBtn.className = 'email-suggestion-dismiss';
                dismissBtn.textContent = strings.dismiss;
                dismissBtn.addEventListener('click', function() {
                    dismissedFor = rawValue;
                    clear();
                });
                container.appendChild(dismissBtn);
                container.style.display = 'block';
            }

            function evaluate() {
                var value = input.value.trim();
                if (!value || value === dismissedFor) { clear(); return; }
                var suggested = suggestEmailDomain(value);
                if (suggested && suggested.toLowerCase() !== value.toLowerCase()) {
                    show(value, suggested);
                } else {
                    clear();
                }
            }

            input.addEventListener('blur', evaluate);
            input.addEventListener('input', function() {
                if (container.style.display !== 'none') clear();
            });
        }

        function getMetadata(locale) {
            var params = new URLSearchParams(window.location.search);
            var metadata = [];
            metadata.push('Page language: ' + locale);
            metadata.push('Platform: ' + detectPlatform());
            if (params.get('version')) metadata.push('App version: ' + params.get('version'));
            if (params.get('mode')) metadata.push('Mode: ' + params.get('mode'));
            if (params.get('reference')) metadata.push('Reference: ' + params.get('reference'));
            return metadata;
        }

        function buildEmailBody(t, locale) {
            var message = document.getElementById('message').value.trim();
            var contact = document.getElementById('contact').value.trim();
            var metadata = getMetadata(locale);
            var parts = [
                t.detailsHeader,
                message
            ];

            if (contact) {
                parts.push('', t.contactHeader, contact);
            }

            if (metadata.length) {
                parts.push('', t.metadataHeader, metadata.join('\n'));
            }

            return parts.join('\n');
        }

        function render() {
            var locale = getLocale();
            var t = i18n[locale];
            document.documentElement.lang = locale;
            document.title = t.documentTitle;

            document.getElementById('title').textContent = t.title;
            document.getElementById('intro').textContent = t.intro;
            document.getElementById('messageLabel').textContent = t.messageLabel;
            document.getElementById('message').placeholder = t.messagePlaceholder;
            document.getElementById('messageHint').textContent = t.messageHint;
            document.getElementById('contactLabel').textContent = t.contactLabel;
            document.getElementById('contact').placeholder = t.contactPlaceholder;
            document.getElementById('contactHint').textContent = t.contactHint;
            document.getElementById('buttonText').textContent = t.button;
            document.getElementById('error').textContent = t.error;
            document.getElementById('fallbackIntro').textContent = t.fallbackIntro;
            document.getElementById('emailLabel').textContent = t.emailLabel;
            document.getElementById('recipient').textContent = RECIPIENT;
            document.getElementById('footer').textContent = t.footer;

            var form = document.getElementById('reportForm');
            var error = document.getElementById('error');
            var submitButton = document.getElementById('submitButton');

            setupEmailSuggestion(
                document.getElementById('contact'),
                document.getElementById('emailSuggestion'),
                { suggestion: t.emailSuggestion, dismiss: t.emailSuggestionDismiss }
            );

            form.addEventListener('submit', function(event) {
                event.preventDefault();

                var message = document.getElementById('message').value.trim();
                if (message.length < 8) {
                    error.textContent = t.error;
                    error.style.display = 'block';
                    return;
                }
                var contactEl = document.getElementById('contact');
                var contact = contactEl.value.trim();
                contactEl.value = contact;
                if (!isEmailSyntaxValid(contact)) {
                    error.textContent = t.emailError;
                    error.style.display = 'block';
                    contactEl.focus();
                    return;
                }
                error.style.display = 'none';
                document.getElementById('fallback').style.display = 'none';

                var formData = new FormData(form);
                formData.set('formType', FORM_TYPE);
                formData.set('source', SOURCE);
                formData.set('subject', t.subject);
                formData.set('pageLanguage', locale);
                formData.set('platform', detectPlatform());

                // Pass through any URL params the iOS/Android app added so
                // they end up as separate fields in the Sheet.
                var urlParams = new URLSearchParams(window.location.search);
                ['version', 'mode', 'reference'].forEach(function(k) {
                    var v = urlParams.get(k);
                    if (v) formData.set(k, v);
                });

                submitButton.disabled = true;

                fetch(SCRIPT_URL, { method: 'POST', body: formData })
                    .then(function(response) {
                        if (!response.ok) throw new Error('HTTP ' + response.status);
                        return response.text();
                    })
                    .then(function() {
                        document.getElementById('successText').textContent = t.success;
                        form.style.display = 'none';
                        document.getElementById('success').style.display = 'block';
                    })
                    .catch(function() {
                        // Reveal the prepared email + recipient so the user
                        // has a manual escape hatch.
                        error.textContent = t.networkError;
                        error.style.display = 'block';

                        var body = buildEmailBody(t, locale);
                        document.getElementById('fallbackMessage').textContent = body;
                        document.getElementById('fallback').style.display = 'block';

                        submitButton.disabled = false;
                    });
            });
        }

        render();
    </script>
</body>
</html>
