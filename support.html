<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support</title>
    <link rel="stylesheet" href="fonts/fonts.css">
    <style>
        :root {
            --bg: #eeecea;
            --fg: #1a1a18;
            --fg-secondary: #4a4944;
            --fg-tertiary: #7a7872;
            --divider: #c5c1bb;
            --card-bg: #f7f5f2;
            --card-border: #d8d4ce;
            --btn-bg: #1a1a18;
            --btn-fg: #eeecea;
            --btn-hover: #333330;
            --max-width: 520px;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #5a5856;
                --fg: #f2f0ec;
                --fg-secondary: #d5d2cc;
                --fg-tertiary: #b0ada7;
                --divider: #706d68;
                --card-bg: #4a4845;
                --card-border: #635f5b;
                --btn-bg: #f2f0ec;
                --btn-fg: #3a3836;
                --btn-hover: #e0ddd8;
            }
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Source Serif 4', Georgia, serif;
            background: var(--bg);
            color: var(--fg);
            line-height: 1.7;
            font-size: 16px;
            -webkit-font-smoothing: antialiased;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 64px 28px;
        }

        .page {
            max-width: var(--max-width);
            width: 100%;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .ornament {
            text-align: center;
            color: var(--fg-tertiary);
            font-size: 18px;
            letter-spacing: 0.4em;
            margin-bottom: 44px;
            opacity: 0;
            animation: fadeIn 1s ease 0.2s forwards;
        }

        h1 {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: clamp(28px, 6vw, 36px);
            font-weight: 700;
            line-height: 1.2;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            text-align: center;
            color: var(--fg);
            opacity: 0;
            animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.3s forwards;
        }

        .divider {
            width: 48px;
            height: 1px;
            background: var(--divider);
            margin: 36px auto;
            opacity: 0;
            animation: fadeIn 0.8s ease 0.5s forwards;
        }

        .body-text {
            font-size: 16px;
            font-weight: 400;
            line-height: 1.85;
            color: var(--fg-secondary);
            text-align: center;
            opacity: 0;
            animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.65s forwards;
        }

        /* --- FAQ --- */
        .faq-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 36px;
            opacity: 0;
            animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.8s forwards;
        }

        .faq-item {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            overflow: hidden;
        }

        .faq-question {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 16px 20px;
            background: none;
            border: none;
            cursor: pointer;
            font-family: 'Source Serif 4', Georgia, serif;
            font-size: 15px;
            font-weight: 400;
            color: var(--fg);
            text-align: left;
            transition: color 0.2s ease;
        }

        .faq-question:hover {
            color: var(--fg);
        }

        .faq-chevron {
            flex-shrink: 0;
            width: 16px;
            height: 16px;
            color: var(--fg-tertiary);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .faq-item.open .faq-chevron {
            transform: rotate(180deg);
        }

        .faq-answer {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .faq-item.open .faq-answer {
            max-height: 300px;
        }

        .faq-answer-inner {
            padding: 0 20px 16px;
            font-size: 15px;
            line-height: 1.75;
            color: var(--fg-secondary);
        }

        /* --- Contact --- */
        .contact-section {
            margin-top: 36px;
            text-align: center;
            opacity: 0;
            animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 1.0s forwards;
        }

        .contact-label {
            font-size: 14px;
            color: var(--fg-tertiary);
            margin-bottom: 16px;
            font-style: italic;
        }

        .contact-button {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-family: 'Source Serif 4', Georgia, serif;
            font-size: 15px;
            font-weight: 400;
            letter-spacing: 0.04em;
            color: var(--btn-fg);
            background: var(--btn-bg);
            text-decoration: none;
            padding: 14px 30px;
            border-radius: 100px;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            cursor: pointer;
        }

        .contact-button:hover {
            background: var(--btn-hover);
            transform: translateY(-1px);
        }

        .contact-button svg {
            width: 16px;
            height: 16px;
        }

        /* --- Report form --- */
        .report-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 24px;
            text-align: left;
        }

        .field label {
            display: block;
            font-size: 0.78rem;
            font-weight: 500;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--fg-tertiary);
            margin-bottom: 8px;
        }

        .field input,
        .field textarea {
            width: 100%;
            font-family: 'Source Serif 4', Georgia, serif;
            font-size: 1rem;
            font-weight: 400;
            color: var(--fg);
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 10px;
            padding: 13px 15px;
            outline: none;
            transition: border-color 0.25s ease;
        }

        .field input:focus,
        .field textarea:focus { border-color: var(--fg-tertiary); }

        .field input::placeholder,
        .field textarea::placeholder { color: var(--fg-tertiary); opacity: 0.8; }

        .field textarea { min-height: 112px; resize: vertical; line-height: 1.6; }

        .submit-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-family: 'Source Serif 4', Georgia, serif;
            font-size: 1rem;
            font-weight: 500;
            letter-spacing: 0.04em;
            background: var(--btn-bg);
            color: var(--btn-fg);
            border: none;
            border-radius: 12px;
            padding: 15px 22px;
            margin-top: 2px;
            cursor: pointer;
            transition: background 0.25s ease, transform 0.25s ease;
        }

        .submit-button:hover { background: var(--btn-hover); transform: translateY(-1px); }

        .submit-button svg { width: 18px; height: 18px; }
        .submit-button:disabled { opacity: 0.6; cursor: progress; }

        .honeypot { position: absolute; left: -9999px; width: 1px; height: 1px; opacity: 0; }

        .form-error {
            display: none;
            margin-top: 2px;
            font-size: 0.9rem;
            line-height: 1.5;
            color: #b3403a;
            text-align: left;
        }
        .form-error a { color: inherit; }
        @media (prefers-color-scheme: dark) { .form-error { color: #ffb4a9; } }

        /* Advisory only — never blocks submission. Reuses the field-hint
           styling so it reads as a suggestion, not an error. */
        .email-suggestion {
            display: none;
            margin-top: 7px;
            color: var(--fg-secondary);
            font-size: 0.82rem;
            font-weight: 300;
            line-height: 1.5;
        }

        .email-suggestion button {
            font: inherit;
            font-weight: 500;
            color: inherit;
            background: none;
            border: none;
            padding: 0;
            cursor: pointer;
            text-decoration: underline;
        }

        .email-suggestion-accept {
            color: var(--fg);
            font-weight: 600;
        }

        .form-success {
            display: none;
            margin-top: 24px;
            font-size: 1rem;
            line-height: 1.7;
            color: var(--fg-secondary);
            text-align: center;
        }

        /* --- Footer --- */
        .footer {
            margin-top: 48px;
            text-align: center;
            line-height: 2.2;
            opacity: 0;
            animation: fadeIn 0.8s ease 1.15s forwards;
        }

        .footer-link {
            font-size: 14px;
            font-style: italic;
            color: var(--fg-tertiary);
            text-decoration: none;
            transition: color 0.2s ease;
            border-bottom: 1px solid transparent;
        }

        .footer-link:hover {
            color: var(--fg-secondary);
            border-bottom-color: var(--divider);
        }

        .footer-sep {
            color: var(--fg-tertiary);
            margin: 0 10px;
            font-size: 13px;
            opacity: 0.55;
        }

        @media (max-width: 480px) {
            body { padding: 48px 24px; }
            .ornament { margin-bottom: 36px; }
            .divider { margin: 28px auto; }
            .faq-list { margin-top: 28px; }
            .contact-section { margin-top: 28px; }
            .footer { margin-top: 40px; }
        }
    </style>
</head>

        // client needed) — it emails bibliahinarioccb@gmail.com, tagged with
        // FORM_TYPE / SOURCE so Support, Book request, and CCB reports stay
        // distinguishable in the one inbox. RECIPIENT is only the manual
        // fallback shown if the request ever fails.
        var SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxE6kYRYF31iIwoJATqHuTEUJilDLWZj0jvlCaTRtAgktWxj3is0fhczmyhMLOaQSLGHw/exec';
        var FORM_TYPE = 'public_domain_books_support';
        var SOURCE = 'Public Domain Books — Support';
        var RECIPIENT = 'bibliahinarioccb@gmail.com';

        // Which platform the submission came from. An explicit ?platform= (set
        // by the app's link) wins; otherwise infer from the user agent, so every
        // submission is tagged. Shared across all forms for a standard payload.
        function detectPlatform() {
            var explicit = new URLSearchParams(window.location.search).get('platform');
            if (explicit) return explicit;
            var ua = navigator.userAgent || '';
            if (/Android/i.test(ua)) return 'Android';
            if (/iPhone|iPad|iPod/i.test(ua)) return 'iOS';
            if (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1) return 'iOS';
            return 'Web';
        }

        // --- Email typo guard (T-FORM-EMAIL) ---
        // Local-only, no network call. isEmailSyntaxValid() catches addresses
        // that can never be delivered (no dot in the domain, a trailing dot,
        // doubled @, internal whitespace) and is the one thing here allowed
        // to block submission — none of those forms would ever reach a real
        // inbox anyway. suggestEmailDomain() is a *guess* at a mistyped
        // well-known domain (gimail.com -> gmail.com) via edit distance
        // against a short known-domains list, so a new typo needs no code
        // change; it only ever offers, never corrects or blocks.
        var KNOWN_EMAIL_DOMAINS = [
            'gmail.com', 'googlemail.com', 'yahoo.com', 'outlook.com', 'hotmail.com',
            'icloud.com', 'me.com', 'live.com', 'aol.com', 'protonmail.com',
            'gmx.com', 'yandex.com', 'mail.com', 'zoho.com'
        ];

        function isEmailSyntaxValid(value) {
            if (!value || /\s/.test(value)) return false;
            if ((value.match(/@/g) || []).length !== 1) return false;
            var at = value.indexOf('@');
            var local = value.slice(0, at);
            var domain = value.slice(at + 1);
            if (!local || !domain) return false;
            if (domain.charAt(0) === '.' || domain.charAt(domain.length - 1) === '.') return false;
            if (domain.indexOf('..') !== -1) return false;
            if (domain.indexOf('.') === -1) return false;
            var labels = domain.split('.');
            var tld = labels[labels.length - 1];
            return /^[a-zA-Z]{2,}$/.test(tld);
        }

        function levenshtein(a, b) {
            var m = a.length, n = b.length;
            var prev = [];
            for (var j = 0; j <= n; j++) prev[j] = j;
            for (var i = 1; i <= m; i++) {
                var cur = [i];
                for (j = 1; j <= n; j++) {
                    var cost = a.charAt(i - 1) === b.charAt(j - 1) ? 0 : 1;
                    cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + cost);
                }
                prev = cur;
            }
            return prev[n];
        }

        function suggestEmailDomain(value) {
            var at = value.lastIndexOf('@');
            if (at === -1 || at === value.length - 1) return null;
            var domain = value.slice(at + 1).toLowerCase();
            if (KNOWN_EMAIL_DOMAINS.indexOf(domain) !== -1) return null;

            var best = null, bestDist = Infinity;
            for (var i = 0; i < KNOWN_EMAIL_DOMAINS.length; i++) {
                var candidate = KNOWN_EMAIL_DOMAINS[i];
                if (Math.abs(candidate.length - domain.length) > 3) continue;
                var dist = levenshtein(domain, candidate);
                if (dist < bestDist) { bestDist = dist; best = candidate; }
            }
            var threshold = domain.length <= 5 ? 1 : 2;
            if (best && bestDist > 0 && bestDist <= threshold) {
                return value.slice(0, at + 1) + best;
            }
            return null;
        }

        // Wires the inline "did you mean…?" suggestion onto one email input.
        // Purely advisory: accepting fills the field, dismissing just hides
        // it for that exact typed value, and either way the form still
        // submits whatever the reader leaves in the field.
        function setupEmailSuggestion(input, container, strings) {
            if (!input || !container) return;
            var dismissedFor = null;

            function clear() {
                container.textContent = '';
                container.style.display = 'none';
            }

            function show(rawValue, suggested) {
                container.textContent = '';
                var template = strings.suggestion;
                var idx = template.indexOf('{email}');
                var before = idx === -1 ? template : template.slice(0, idx);
                var after = idx === -1 ? '' : template.slice(idx + 7);
                container.appendChild(document.createTextNode(before));
                var acceptBtn = document.createElement('button');
                acceptBtn.type = 'button';
                acceptBtn.className = 'email-suggestion-accept';
                acceptBtn.textContent = suggested;
                acceptBtn.addEventListener('click', function() {
                    input.value = suggested;
                    clear();
                    input.focus();
                });
                container.appendChild(acceptBtn);
                container.appendChild(document.createTextNode(after + ' '));
                var dismissBtn = document.createElement('button');
                dismissBtn.type = 'button';
                dismissBtn.className = 'email-suggestion-dismiss';
                dismissBtn.textContent = strings.dismiss;
                dismissBtn.addEventListener('click', function() {
                    dismissedFor = rawValue;
                    clear();
                });
                container.appendChild(dismissBtn);
                container.style.display = 'block';
            }

            function evaluate() {
                var value = input.value.trim();
                if (!value || value === dismissedFor) { clear(); return; }
                var suggested = suggestEmailDomain(value);
                if (suggested && suggested.toLowerCase() !== value.toLowerCase()) {
                    show(value, suggested);
                } else {
                    clear();
                }
            }

            input.addEventListener('blur', evaluate);
            input.addEventListener('input', function() {
                if (container.style.display !== 'none') clear();
            });
        }

        function sendReport(event) {
            event.preventDefault();
            var locale = getLocale();
            var t = i18n[locale];
            var fs = formStrings[locale] || formStrings.en;
            var emailEl = document.getElementById('report-email');
            var message = document.getElementById('report-message').value.trim();
            var email = emailEl.value.trim();
            var errorEl = document.getElementById('form-error');
            var button = document.getElementById('submit-button');

            // Honeypot: a bot that fills the hidden field is silently dropped.
            if (document.getElementById('_hp').value) { return; }

            emailEl.value = email;
            if (!isEmailSyntaxValid(email)) {
                errorEl.textContent = fs.emailError;
                errorEl.style.display = 'block';
                emailEl.focus();
                return;
            }

            var data = new FormData();
            data.set('formType', FORM_TYPE);
            data.set('source', SOURCE);
            data.set('subject', t.subject);
            data.set('message', message);
            data.set('contact', email);
            data.set('platform', detectPlatform());
            data.set('pageLanguage', locale);
            var v = new URLSearchParams(window.location.search).get('v');
            if (v) data.set('appVersion', v);

            errorEl.style.display = 'none';
            button.disabled = true;

            fetch(SCRIPT_URL, { method: 'POST', body: data })
                .then(function(r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
                .then(function() {
                    document.getElementById('form-wrap').style.display = 'none';
                    var s = document.getElementById('form-success');
                    s.textContent = fs.success;
                    s.style.display = 'block';
                })
                .catch(function() {
                    errorEl.innerHTML = fs.netError + ' <a href="mail' + 'to:' + RECIPIENT + '">' + RECIPIENT + '</a>';
                    errorEl.style.display = 'block';
                    button.disabled = false;
                });
        }

        function getLocale() {
            var lang = (navigator.language || navigator.userLanguage || 'en').toLowerCase();
            var primary = lang.split('-')[0];
            if (i18n[primary]) return primary;
            return 'en';
        }

        function buildFaqItem(q, a, index) {
            return '<div class="faq-item" data-index="' + index + '">' +
                '<button class="faq-question" onclick="toggleFaq(' + index + ')" aria-expanded="false">' +
                    '<span>' + q + '</span>' +
                    '<svg class="faq-chevron" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5"/></svg>' +
                '</button>' +
                '<div class="faq-answer"><div class="faq-answer-inner">' + a + '</div></div>' +
            '</div>';
        }

        function toggleFaq(index) {
            var item = document.querySelector('.faq-item[data-index="' + index + '"]');
            var btn = item.querySelector('.faq-question');
            var isOpen = item.classList.contains('open');
            // Close all
            document.querySelectorAll('.faq-item.open').forEach(function(el) {
                el.classList.remove('open');
                el.querySelector('.faq-question').setAttribute('aria-expanded', 'false');
            });
            // Open clicked if it was closed
            if (!isOpen) {
                item.classList.add('open');
                btn.setAttribute('aria-expanded', 'true');
            }
        }

        function render() {
            var locale = getLocale();
            var t = i18n[locale];
            document.documentElement.lang = locale === 'zh' ? 'zh-Hans' : locale;

            var fs = formStrings[locale] || formStrings.en;

            var faqsHtml = t.faqs.map(function(f, i) {
                return buildFaqItem(f.q, f.a, i);
            }).join('');

            var sendSvg = '<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M6 12L3.269 3.126A59.768 59.768 0 0121.485 12 59.77 59.77 0 013.27 20.876L5.999 12zm0 0h7.5"/></svg>';

            document.getElementById('page').innerHTML =
                '<div class="ornament">\u2022 \u2003 \u2022 \u2003 \u2022</div>' +
                '<h1>' + t.title + '</h1>' +
                '<div class="divider"></div>' +
                '<p class="body-text">' + t.intro + '</p>' +
                '<div class="faq-list">' + faqsHtml + '</div>' +
                '<div class="contact-section">' +
                    '<p class="contact-label">' + t.contactLabel + '</p>' +
                    '<div id="form-wrap">' +
                    '<form class="report-form" onsubmit="sendReport(event)">' +
                        '<div class="field">' +
                            '<label for="report-message">' + fs.msgLabel + '</label>' +
                            '<textarea id="report-message" required placeholder="' + fs.msgPlaceholder + '"></textarea>' +
                        '</div>' +
                        '<div class="field">' +
                            '<label for="report-email">' + fs.emailLabel + '</label>' +
                            '<input id="report-email" type="email" required placeholder="' + fs.emailPlaceholder + '">' +
                            '<p class="email-suggestion" id="email-suggestion" role="status" aria-live="polite"></p>' +
                        '</div>' +
                        '<input type="text" id="_hp" class="honeypot" tabindex="-1" autocomplete="off" aria-hidden="true">' +
                        '<p class="form-error" id="form-error"></p>' +
                        '<button type="submit" class="submit-button" id="submit-button">' + sendSvg + fs.submit + '</button>' +
                    '</form>' +
                    '</div>' +
                    '<p class="form-success" id="form-success"></p>' +
                '</div>' +
                '<div class="footer">' +
                    '<a href="bookrequest.html" class="footer-link">' + fs.moreRequest + '</a>' +
                    '<span class="footer-sep">·</span>' +
                    '<a href="privacy.html" class="footer-link">' + t.privacy + '</a>' +
                '</div>';

            setupEmailSuggestion(
                document.getElementById('report-email'),
                document.getElementById('email-suggestion'),
                { suggestion: fs.emailSuggestion, dismiss: fs.emailSuggestionDismiss }
            );
        }

        render();
    </script>
